name: Notify Slack

# 呼び出し元から受け取る引数
inputs:
  webhook-url:
    required: true
  title:
    required: true
  failed-jobs:
    required: false
    default: ''

# アクションの処理本体
runs:
  using: composite
  steps:
    - name: Send Slack notification
      shell: bash
      # 通知に使う値を環境変数にまとめる
      env:
        SLACK_WEBHOOK_URL: ${{ inputs.webhook-url }}
        TITLE: ${{ inputs.title }}
        FAILED_JOBS: ${{ inputs.failed-jobs }}
        ACTOR: ${{ github.actor }}
        REPO: ${{ github.repository }}
        BRANCH: ${{ github.head_ref || github.ref_name }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PR_TITLE: ${{ github.event.pull_request.title }}
        PR_URL: ${{ github.event.pull_request.html_url }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        # 1. Webhook URL が未設定なら通知をスキップ
        if [ -z "$SLACK_WEBHOOK_URL" ]; then
          echo "SLACK_WEBHOOK_URL is not set; skipping notification."
          exit 0
        fi

        # 2. 通知メッセージの本文を組み立てる
        if [ -n "$PR_NUMBER" ]; then
          TARGET_LINE="• PR: <${PR_URL}|#${PR_NUMBER} ${PR_TITLE}> (\`${BRANCH}\`)"
        else
          TARGET_LINE="• ブランチ: \`${BRANCH}\`"
        fi

        MESSAGE="*${TITLE}*"$'\n'"• リポジトリ: \`${REPO}\`"$'\n'"${TARGET_LINE}"$'\n'"• 実行者: ${ACTOR}"
        if [ -n "$FAILED_JOBS" ]; then
          MESSAGE="${MESSAGE}"$'\n'"• 失敗したジョブ: \`${FAILED_JOBS}\`"
        fi
        MESSAGE="${MESSAGE}"$'\n'"• ログ: <${RUN_URL}|GitHub Actions を開く>"

        # 3. Slack 送信用の JSON に変換する
        PAYLOAD=$(jq -n --arg text "$MESSAGE" '{ text: $text }')

        # 4. Slack の Webhook URL に送信する
        curl --fail --silent --show-error -X POST \
          -H 'Content-type: application/json' \
          --data "$PAYLOAD" \
          "$SLACK_WEBHOOK_URL"
