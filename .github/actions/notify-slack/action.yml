name: Notify Slack
description: Send a failure notification to Slack via Incoming Webhook

inputs:
  webhook-url:
    description: Slack Incoming Webhook URL
    required: true
  title:
    description: Notification title (e.g. "🚨 CI が失敗しました")
    required: true
  failed-jobs:
    description: Comma-separated list of failed job names
    required: false
    default: ''
  actor:
    description: GitHub actor (user who triggered the workflow)
    required: true
  repo:
    description: GitHub repository (e.g. owner/repo)
    required: true
  branch:
    description: Branch name
    required: true
  pr-number:
    description: Pull request number (empty if not a PR)
    required: false
    default: ''
  pr-title:
    description: Pull request title
    required: false
    default: ''
  pr-url:
    description: Pull request URL
    required: false
    default: ''
  run-url:
    description: GitHub Actions run URL
    required: true

runs:
  using: composite
  steps:
    - name: Send Slack notification
      shell: bash
      env:
        SLACK_WEBHOOK_URL: ${{ inputs.webhook-url }}
        TITLE: ${{ inputs.title }}
        FAILED_JOBS: ${{ inputs.failed-jobs }}
        ACTOR: ${{ inputs.actor }}
        REPO: ${{ inputs.repo }}
        BRANCH: ${{ inputs.branch }}
        PR_NUMBER: ${{ inputs.pr-number }}
        PR_TITLE: ${{ inputs.pr-title }}
        PR_URL: ${{ inputs.pr-url }}
        RUN_URL: ${{ inputs.run-url }}
      run: |
        if [ -n "$PR_NUMBER" ]; then
          TARGET_LINE="• *PR:* <${PR_URL}|#${PR_NUMBER} ${PR_TITLE}> (\`${BRANCH}\`)"
        else
          TARGET_LINE="• *ブランチ:* \`${BRANCH}\`"
        fi

        DETAILS="• *リポジトリ:* \`${REPO}\`\n${TARGET_LINE}\n• *実行者:* ${ACTOR}"
        if [ -n "$FAILED_JOBS" ]; then
          DETAILS="${DETAILS}\n• *失敗したジョブ:* \`${FAILED_JOBS}\`"
        fi

        PAYLOAD=$(jq -n \
          --arg title "$TITLE" \
          --arg details "$DETAILS" \
          --arg run_url "$RUN_URL" \
          '{
            attachments: [
              {
                color: "#dc2626",
                blocks: [
                  {
                    type: "header",
                    text: { type: "plain_text", text: $title, emoji: true }
                  },
                  {
                    type: "section",
                    text: { type: "mrkdwn", text: $details }
                  },
                  {
                    type: "actions",
                    elements: [
                      {
                        type: "button",
                        text: { type: "plain_text", text: "GitHub Actions ログを見る", emoji: true },
                        url: $run_url,
                        style: "danger"
                      }
                    ]
                  }
                ]
              }
            ]
          }')

        curl --fail --silent --show-error -X POST \
          -H 'Content-type: application/json' \
          --data "$PAYLOAD" \
          "$SLACK_WEBHOOK_URL"
