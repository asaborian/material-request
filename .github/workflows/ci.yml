name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Type Check
        run: npm run typecheck

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint Check
        run: npm run lint

  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Prettier Check
        run: npx prettier . --check

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest
        run: npm test -- --run

  # 4ジョブのいずれかが失敗したときだけ Slack に1通まとめて通知する（キャンセル時は除外）
  notify-failure:
    needs: [typecheck, lint, format, test]
    if: ${{ failure() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      # ローカルアクション（./.github/actions/notify-slack）を参照するためチェックアウトが必要
      - name: Checkout repository
        uses: actions/checkout@v4

      # 並列実行されたジョブのうち、失敗（failure）したものだけをカンマ区切りで抽出する
      - name: Build failed jobs list
        id: failed-jobs
        env:
          TYPECHECK_RESULT: ${{ needs.typecheck.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          FORMAT_RESULT: ${{ needs.format.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          FAILED=""
          for pair in "typecheck:$TYPECHECK_RESULT" "lint:$LINT_RESULT" "format:$FORMAT_RESULT" "test:$TEST_RESULT"; do
            job="${pair%%:*}"
            res="${pair#*:}"
            if [ "$res" = "failure" ]; then
              FAILED="${FAILED:+$FAILED, }$job"
            fi
          done
          echo "failed=${FAILED}" >> "$GITHUB_OUTPUT"

      # Composite Action 内からは secrets を直接読めないため webhook-url を引数で渡す
      - name: Notify Slack
        uses: ./.github/actions/notify-slack
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          title: '🚨 CI が失敗しました'
          failed-jobs: ${{ steps.failed-jobs.outputs.failed }}
