name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Type Check
        run: npm run typecheck

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint Check
        run: npm run lint

  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Prettier Check
        run: npx prettier . --check

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest
        run: npm test -- --run

  # 4ジョブのいずれかが失敗したときだけ Slack に1通まとめて通知する
  notify-failure:
    # needs: 指定した4つのジョブがすべて完了するまで待ってからこのジョブを実行する
    needs: [typecheck, lint, format, test]
    # if: 4つのうち1つ以上が失敗（failure）し、かつキャンセルされていない（!cancelled）場合のみ実行する
    if: ${{ failure() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      # ローカルの部品（./.github/actions/notify-slack）を読み込むためにリポジトリを取得する
      - name: Checkout repository
        uses: actions/checkout@v4

      # 並列実行された4ジョブのうち、失敗（failure）したジョブ名だけをカンマ区切りで抽出する
      - name: Build failed jobs list
        id: failed-jobs
        env:
          TYPECHECK_RESULT: ${{ needs.typecheck.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          FORMAT_RESULT: ${{ needs.format.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          FAILED=""
          # 「ジョブ名:結果」を1つずつ取り出し、":" で前半（ジョブ名）と後半（結果）に分割する
          for pair in "typecheck:$TYPECHECK_RESULT" "lint:$LINT_RESULT" "format:$FORMAT_RESULT" "test:$TEST_RESULT"; do
            job="${pair%%:*}"
            res="${pair#*:}"
            if [ "$res" = "failure" ]; then
              # すでに文字列が入っていれば ", " を挟んで連結する（配列の join(", ") に相当）
              FAILED="${FAILED:+$FAILED, }$job"
            fi
          done
          # 次のステップから ${{ steps.failed-jobs.outputs.failed }} で参照できるよう出力ファイルに書き出す
          echo "failed=${FAILED}" >> "$GITHUB_OUTPUT"

      # GitHub Actions の仕様上、部品内からは secrets を直接読めないため引数で渡す
      - name: Notify Slack
        uses: ./.github/actions/notify-slack
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          title: '🚨 CI が失敗しました'
          failed-jobs: ${{ steps.failed-jobs.outputs.failed }}
