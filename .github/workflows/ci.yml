name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Type Check
        run: npm run typecheck

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint Check
        run: npm run lint

  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Prettier Check
        run: npx prettier . --check

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest
        run: npm test -- --run

  # 4ジョブのいずれかが失敗したときだけ Slack に1通まとめて通知する
  notify-failure:
    # needs: 指定した4つのジョブがすべて完了するまで待ってからこのジョブを実行する
    needs: [typecheck, lint, format, test]
    # if: 4つのうち1つ以上が失敗（failure）し、かつキャンセルされていない（!cancelled）場合のみ実行する
    if: ${{ failure() && !cancelled() }}
    # 共通ワークフロー（_notify-slack.yml）を呼び出す（secrets: inherit で SLACK_WEBHOOK_URL を引き継ぐ）
    uses: ./.github/workflows/_notify-slack.yml
    with:
      needs-json: ${{ toJSON(needs) }}
    secrets: inherit
