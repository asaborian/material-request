name: E2E Test

on:
  deployment_status:

jobs:
  e2e:
    if: github.event.deployment_status.state == 'success' && github.event.deployment_status.environment == 'Preview'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests against Preview URL
        run: npx playwright test
        env:
          BASE_URL: ${{ github.event.deployment_status.environment_url }}
          CI: 'true'

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  # E2E テストが失敗したときだけ Slack に通知する
  notify-failure:
    # needs: e2e ジョブが完了するまで待ってからこのジョブを実行する
    needs: [e2e]
    # if: e2e ジョブが失敗（failure）し、かつキャンセルされていない（!cancelled）場合のみ実行する
    if: ${{ failure() && !cancelled() }}
    # 共通ワークフロー（_notify-slack.yml）を呼び出す（secrets: inherit で SLACK_WEBHOOK_URL を引き継ぐ）
    uses: ./.github/workflows/_notify-slack.yml
    with:
      needs-json: ${{ toJSON(needs) }}
    secrets: inherit
